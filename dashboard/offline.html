<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0a">
    <meta name="application-name" content="JCM Studio">
    <title>Hors connexion — JCM Studio</title>
    <link rel="stylesheet" href="assets/dashboard-premium.css?v=12">
    <style>
        :root { color-scheme: light; font-family: WTC Inter, sans-serif; color: #f1f4ef; background: #14211d; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; background-image: linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px); background-size: 34px 34px; }
        main { width: min(100%, 360px); }
        .mark { display: block; width: 48px; aspect-ratio: 1; margin-bottom: 42px; }
        .mark img { display: block; width: 100%; height: 100%; border-radius: 10px; }
        p { margin: 0 0 12px; color: #aab9af; font-size: 10px; font-weight: 600; }
        h1 { margin: 0; font: 42px/.98 WTC Anton, Impact, sans-serif; }
        h1 span { color: #c7f36b; }
        .note { margin-top: 20px; font-size: 13px; font-weight: 400; line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <span class="mark" aria-hidden="true"><img src="assets/icons/icon.svg" alt=""></span>
        <p>JCM / STUDIO</p>
        <h1>Connexion<br><span>indisponible.</span></h1>
        <p class="note">Vérifiez votre connexion Internet puis rechargez la page.</p>
    </main>
</body>
</html>
